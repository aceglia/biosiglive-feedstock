{% set name = "biosiglive" %}
{% set version = "2.0.4" %}

package:
  name: "{{ name|lower }}"
  version: "{{ version }}"

source:
  url: https://github.com/pyomeca/biosiglive/archive/refs/tags/v2.0.4.tar.gz
  sha256: 296cad6dac6df9d7f73874b4f749f6c20815c558f66c6e252bec86e7020bfed2

build:
  number: 0
  noarch: python
  script: "{{ PYTHON }} -m pip install . -vv"

requirements:
  host:
    - pip
    # - hatchling
    - python {{ python_min }}
  run:
    - python >={{ python_min }}
    - matplotlib-base
    - numpy
    - scipy
    - pyqtgraph
    - pyqt
    - pyopengl


test:
  requires:
    - python {{ python_min }}
  commands:
    - xvfb-run python -c "import biosiglive"  # [linux]
  imports:
    - biosiglive  # [not linux]
about:
  home: "https://github.com/pyomeca/biosiglive"
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: "A Python package for real-time streaming and processing of biomechanical data"
  doc_url: https://github.com/pyomeca/biosiglive/blob/master/README.md
  dev_url: https://github.com/pyomeca/biosiglive

extra:
  recipe-maintainers:
    - aceglia
